on:
  push:
    branches:
      - main

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Set up PNPM
        run: pnpm ci
        
      - uses: Yi-Jun-Wu/test-deploy-action/.github/actions/deploy@main
      # - name: Deploy
      #   run: node src/main.ts
      #   env:
      #     ACTIONS_RUNTIME_TOKEN : ${{ secrets.ACTIONS_RUNTIME_TOKEN }}
      #     TOKEN : ${{ secrets.GITHUB_TOKEN }}