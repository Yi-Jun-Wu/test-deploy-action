on:
  push:
    branches:
      - main

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Set up PNPM
        run: pnpm ci
          
        
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('MY_ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);
            core.exportVariable('MY_ACTIONS_RUNTIME_URL', process.env.ACTIONS_RUNTIME_URL);
            core.exportVariable('MY_ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL);
      - name: Deploy
        run: pnpm deploy