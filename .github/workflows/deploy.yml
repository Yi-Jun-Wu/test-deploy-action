on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build site
        run: |
          mkdir -p dist
          cp README.md dist/
          cp index.html dist/

      - name: Deploy
        id: deployment
        # uses: ./.github/actions/deploy
        uses: Yi-Jun-Wu/test-deploy-action/.github/actions/deploy@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/
          expire: 10
