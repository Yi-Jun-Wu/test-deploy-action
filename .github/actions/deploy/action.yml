name: 'Deploy GitHub Pages site'
description: 'Deploy a directory as a GitHub Pages site without any toolkit dependency'
author: 'GitHub'

branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  token:
    description: 'GitHub token used to call the Pages deployment API.'
    required: true
    default: ${{ github.token }}
  path:
    description: 'Path of the directory containing the static assets to deploy.'
    required: true
    default: 'dist/'
  expire:
    description: >-
      Duration in seconds to poll the deployment before giving up. When set,
      the uploaded artifact is deleted once it is no longer needed and the
      logs are emitted after that deletion. When omitted (or 0), the artifact
      is kept until its retention period ends and logs are streamed live.
    required: false

outputs:
  page_url:
    description: 'URL the deployed GitHub Pages site is served from.'

runs:
  using: 'node24'
  main: 'index.mjs'
