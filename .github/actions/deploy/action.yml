name: 'Deploy GitHub Pages site'
description: 'Deploy a directory as a GitHub Pages site without any toolkit dependency'
author: 'GitHub'

branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  token:
    description: 'GitHub token used to call the Pages deployment API.'
    required: true
    default: ${{ github.token }}
  path:
    description: 'Path of the directory containing the static assets to deploy.'
    required: true
    default: 'dist/'
  expire:
    description: >-
      Duration in seconds to poll the deployment before giving up. The uploaded
      artifact is deleted once it is no longer needed. Set to 0 to keep the
      artifact (it will then remain until its retention period ends).
    required: true
    default: '30'

outputs:
  page_url:
    description: 'URL the deployed GitHub Pages site is served from.'

runs:
  using: 'node24'
  main: 'index.mjs'
